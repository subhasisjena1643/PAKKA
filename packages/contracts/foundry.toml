# PakkaEscrow Foundry project. Contracts are implemented in Prompt 03 (G03); this is scaffold config.
# Solidity ^0.8.24, OpenZeppelin 5.x is added in Prompt 03. evm_version is intentionally left to the solc
# default and must be confirmed against official Monad docs before deployment (plan §3.2, Prompt 06).
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = ["forge-std/=lib/forge-std/src/"]

[profile.ci]
verbosity = 3

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

# https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
